[package]
name = "task-progress"
version = "0.1.0"
edition = "2024"
description = "Mandara plugin: a running-light task progress bar"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc", "std"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Local hot-install iterations: release code without the fat-LTO cost.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 8
